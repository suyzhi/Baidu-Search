# 资源站目录（由 pansearch sites probe 生成/更新）
# verticals 决定查询时是否命中该站；search 里的 {q} 会被替换成 URL 编码后的关键词。
sites:
- name: dmhy
  domain: share.dmhy.org
  verticals:
  - anime
  search: https://share.dmhy.org/?keyword={q}
  result_re: https://share\.dmhy\.org/[a-z0-9-]+/[a-z0-9-]+/[a-z0-9-]+/\d+
  verified: true
  note: probe /?keyword={q}
- name: 4download
  domain: 4download.net
  verticals:
  - audio-tool
  - music
  search: https://4download.net/index.php?do=search&subaction=search&story={q}
  result_re: https://4download\.net/[a-z0-9-]+\.html
  verified: true
  note: probe /index.php?do=search&subaction=search&story={q}
