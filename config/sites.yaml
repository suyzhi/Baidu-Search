# 资源站目录（由 pansearch sites probe 生成/更新）
# verticals 决定查询时是否命中该站；search 里的 {q} 会被替换成 URL 编码后的关键词。
sites:
- name: plugintorrent
  domain: plugintorrent.com
  verticals:
  - audio-tool
  search: https://plugintorrent.com/?s={q}
  result_re: https://plugintorrent\.com/[a-z0-9-]+/
  verified: true
  note: probe /?s={q} yield=30
- name: vstorrent
  domain: vstorrent.org
  verticals:
  - audio-tool
  - music
  search: https://vstorrent.org/?s={q}
  result_re: https://vstorrent\.org/[a-z0-9-]+/
  verified: true
  note: probe /?s={q} yield=30
