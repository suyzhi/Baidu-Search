# 资源站目录（由 pansearch sites probe 生成/更新）
# verticals 决定查询时是否命中该站；search 里的 {q} 会被替换成 URL 编码后的关键词。
sites:
- name: mikanani
  domain: mikanani.me
  verticals:
  - anime
  search: https://mikanani.me/Home/Search?searchstr={q}
  result_re: https://mikanani\.me/[a-z0-9_-]+/[a-z0-9_-]+/\d+[a-z0-9_-]+
  verified: true
  note: probe https://mikanani.me/Home/Search?searchstr={q} yield=310
