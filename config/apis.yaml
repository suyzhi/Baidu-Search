# 公开 API 数据源
#
# 为什么要 API 而不是爬页面：
#   学术与漫画这两个领域，用 HTTP 爬页面基本爬不到 —— 实测 arXiv 之外的
#   Gutenberg / libgen / manhuagui / dm5 的搜索页只返回导航链接（JS 渲染），
#   拿不到任何条目。但它们都有公开 API，结构化、稳定、不需要解析 HTML。
#
# 字段说明：
#   url            搜索 URL 模板，{q} 会被替换成 URL 编码后的关键词
#   format         json | xml
#   items          JSON 点路径 / XML 标签名，指向结果列表
#   title          条目内的标题点路径（可省略）
#   link           条目内的链接点路径（与 link_template 二选一）
#   link_template  用条目字段拼链接，如 "https://mangadex.org/title/{id}"
#   vertical       所属垂直领域，决定查询时是否命中该 API
#   weight         排序权重

apis:
  # ---- 2026-09-22 由"API 侦查"逐个实测收录（括号里是当次命中数）----
  # 判定标准：无需 key、JSON 可解析、条目能拼出可点链接。
  # 明确**没收**的（实测无产出/需 key/字段无法解析）：semantic scholar(429)、
  # core.ac.uk(需 key)、opensubtitles(需 key)、tmdb/omdb(需 key)、jikan(504)、
  # biorxiv(只能按日期不能按关键词)、figshare(需 POST)、standardebooks/gutenberg
  # 的 HTML 搜索页(适配器只吃 json/xml)、hathitrust(403 CF)。
  # ---- 需要适配器新能力的（POST / 顶层数组）----
  # 实测没收的两个 HTML 搜索页：standardebooks / gutenberg 的搜索结果**是 JS 渲染**，
  # 首屏 HTML 里只有导航锚点、没有 /ebooks/<id> 链接 —— 抽不到就不是数据源。
  # ---- 第三批实测（2026-09-22，关键词 "matrix"）----
  # 实测可用：DOAB（DSpace REST，需把 handle 拼成 URL）、OAPEN（同）
  # 实测**不收**：EZTV（只有"最新种子"接口，没有关键词检索）/
  #   openml(412) / bhl(401 需 key) / anilist(404) / chesscom(404) /
  #   annas-archive·libgen·z-lib·nekobt(连不上) / deezer·itunes·tvmaze·wikidata·
  #   huggingface-datasets（都是元数据，没有可下载链接）
  - name: doab
    vertical: ebook,academic
    enabled: true
    weight: 0.6
    url: "https://directory.doabooks.org/rest/search?query={q}&expand=metadata&limit=20"
    format: json
    items: "$"
    title: name
    # DSpace REST 的 handle 是裸编号（如 20.500.12854/136739），必须拼成 URL，
    # 否则 build_link 会因为"不是 http 开头"整条丢掉（实测 0 条就是这么来的）。
    link_template: "https://directory.doabooks.org/handle/{handle}"

  - name: oapen
    vertical: ebook,academic
    enabled: true
    weight: 0.6
    url: "https://library.oapen.org/rest/search?query={q}&expand=metadata&limit=20"
    format: json
    items: "$"
    title: name
    link_template: "https://library.oapen.org/handle/{handle}"

  - name: figshare
    vertical: academic
    enabled: true
    weight: 0.5
    method: POST
    body: '{"search_for": "{q}", "page_size": 20}'
    url: "https://api.figshare.com/v2/articles/search"
    format: json
    items: "$"
    title: title
    link: url_public_html

  - name: tvmaze
    vertical: movie
    enabled: true
    weight: 0.5
    url: "https://api.tvmaze.com/search/shows?q={q}"
    format: json
    items: "$"
    title: show.name
    link: show.url

  - name: gutendex
    vertical: ebook
    enabled: true
    weight: 0.6
    url: "https://gutendex.com/books/?search={q}"
    format: json
    items: results
    title: title
    link_template: "https://www.gutenberg.org/ebooks/{id}"

  - name: zenodo
    vertical: academic
    enabled: true
    weight: 0.5
    url: "https://zenodo.org/api/records?q={q}&size=20"
    format: json
    items: hits.hits
    title: metadata.title
    link: links.self_html

  - name: datacite
    vertical: academic
    enabled: true
    weight: 0.5
    url: "https://api.datacite.org/dois?query={q}&page[size]=20"
    format: json
    items: data
    title: attributes.titles.0.title
    link: attributes.url

  - name: kitsu
    vertical: anime,comic
    enabled: true
    weight: 0.6
    # Kitsu 是 JSON:API：Accept 不带 vnd.api+json 会直接 406（实测）
    headers:
      Accept: "application/vnd.api+json"
    url: "https://kitsu.io/api/edge/anime?filter[text]={q}&page[limit]=20"
    format: json
    items: data
    title: attributes.canonicalTitle
    link_template: "https://kitsu.io/anime/{id}"

  - name: yts
    vertical: movie
    enabled: true
    weight: 0.6
    url: "https://yts.lt/api/v2/list_movies.json?query_term={q}&limit=20"
    format: json
    items: data.movies
    title: title
    link: url

  - name: arxiv
    vertical: academic
    enabled: true
    weight: 0.8
    url: "http://export.arxiv.org/api/query?search_query=all:{q}&max_results=20"
    format: xml
    items: entry
    title: title
    link: id
    # arXiv 官方要求每次请求间隔 ≥3 秒，连发会被 429。
    # 被限流时那一发要等 16 秒还返回 0 条 —— 既慢又白等，所以主动限流。
    min_interval: 3.0

  - name: crossref
    vertical: academic
    enabled: true
    weight: 0.7
    url: "https://api.crossref.org/works?query={q}&rows=20"
    format: json
    items: message.items
    title: title          # crossref 的 title 是数组，取第一个
    link: URL

  - name: openalex
    vertical: academic
    enabled: true
    weight: 0.7
    url: "https://api.openalex.org/works?search={q}&per-page=20"
    format: json
    items: results
    title: display_name
    link: doi

  - name: mangadex
    vertical: comic,anime
    enabled: true
    weight: 0.7
    url: "https://api.mangadex.org/manga?title={q}&limit=20"
    format: json
    items: data
    title: attributes.title.en
    link_template: "https://mangadex.org/title/{id}"

  # ---- 以下 4 个 API 于 2026-09-21 逐个实测收录（括号内为当次响应的命中数）----
  # 电子书 / 学术领域的公开 API：结构化、无需 key、长期稳定。
  - name: archive_org
    vertical: ebook,academic
    enabled: true
    weight: 0.7
    url: "https://archive.org/advancedsearch.php?q={q}&fl[]=identifier&fl[]=title&rows=20&output=json"
    format: json
    items: response.docs
    title: title
    link_template: "https://archive.org/details/{identifier}"

  - name: openlibrary
    vertical: ebook
    enabled: true
    weight: 0.6
    url: "https://openlibrary.org/search.json?q={q}&limit=20"
    format: json
    items: docs
    title: title
    link_template: "https://openlibrary.org{key}"

  - name: europepmc
    vertical: academic
    enabled: true
    weight: 0.7
    url: "https://www.ebi.ac.uk/europepmc/webservices/rest/search?query={q}&format=json&pageSize=20"
    format: json
    items: resultList.result
    title: title
    link_template: "https://europepmc.org/article/{source}/{id}"

  # 中文公版书/古籍全文检索（维基文库）。实测 "论语" 命中 6 条。
  - name: wikisource_zh
    vertical: ebook
    enabled: true
    weight: 0.6
    url: "https://zh.wikisource.org/w/api.php?action=query&list=search&srsearch={q}&format=json"
    format: json
    items: query.search
    title: title
    link_template: "https://zh.wikisource.org/wiki/{title}"

  # ---- 再补几个学术 API（2026-09-21 逐个实测命中数）----
  # 实测**没有产出**因而不收的：pubmed（返回的是裸 ID 列表，拿不到可点链接）、
  # openaire（结构随版本变动，抽不到标题/链接）、semantic scholar（429）、
  # scielo（403）、dblp（非 JSON）。不收它们是不想让"源"的数字好看但结果变差。
  - name: plos
    vertical: academic
    enabled: true
    weight: 0.7
    url: "https://api.plos.org/search?q={q}&rows=20&fl=id,title"
    format: json
    items: response.docs
    title: title
    link_template: "https://journals.plos.org/plosone/article?id={id}"

  - name: osf
    vertical: academic
    enabled: true
    weight: 0.6
    url: "https://api.osf.io/v2/nodes/?filter[title]={q}&page[size]=20"
    format: json
    items: data
    title: attributes.title
    link_template: "https://osf.io/{id}/"

  - name: doaj
    vertical: academic
    enabled: true
    weight: 0.6
    url: "https://doaj.org/api/search/articles/{q}?pageSize=20"
    format: json
    items: results
    title: bibjson.title
    link_template: "https://doaj.org/article/{id}"
