# 数据源配置：开关 / 权重 / 限速
# 新增一个数据源 = 写一个 adapters/xxx.py + 在这里加一段

# 百度优先，其余网盘兜底
pan_priority:
  - baidu
  - quark
  - aliyun
  - "115"
  - xunlei
  - tianyi
  - "123"
  - uc
  - pikpak
  - magnet

sources:
  pansou:
    enabled: true
    kind: pansou
    # 自建实例优先（scripts/start-pansou.sh 一键起 Docker）：
    #   实测「三体」自建 374 条（百度 28）vs 公共 41 条（百度 1）；
    #   热缓存 0.17s，冷启动 8~30s。公共实例作兜底。
    instances:
      - http://127.0.0.1:8888
      - https://so.252035.xyz
    weight: 1.0
    timeout: 20
    # 截止时间必须收着给：主查询与补搜查询是并行的，各自都会吃满这个上限。
    # 实测设 45s 时，一次 PanSou 卡顿会让整体搜索变成 45s(等待) + 验活 ≈ 52s。
    # 正常情况抓取只要 4.2s（热缓存 0.2s），20s 足够覆盖冷启动。
    deadline: 20
    retries: 0            # 自建实例失败就直接降级到公共实例，不必重试
    concurrency: 2
    rate_limit_qps: 5.0

  # ---- C 环：Telegram 频道（本地索引直连）----
  # 全网网盘链接的主要产地。直连 t.me，不经第三方，可并行上百频道 + 向历史翻页。
  # 首次搜索若索引为空会自动抓一轮；之后用 pansearch index crawl 持续加深。
  telegram:
    enabled: true
    kind: tg
    weight: 0.9
    auto_index: true          # 索引为空时自动抓最新一页
    max_hits: 400             # 每次检索最多取多少条消息
    crawl_concurrency: 12
    timeout: 20
    channels_file: null       # 默认 config/tg_channels.txt
    index_path: null          # 默认 .cache/tg_index.sqlite3

  # ---- B 环：搜索引擎定向检索（捞聚合站搜不到的"野链接"）----
  # 两阶段：先搜到"资源讨论页"，再抓这些页面抽网盘链接。
  # 实测：绝大多数引擎不索引 pan.baidu.com/s 本身，但索引讨论页 → 必须两阶段。
  # brave 直接命中最多但会 429；so 备用。
  websearch:
    enabled: true
    kind: websearch
    weight: 0.6
    timeout: 25
    deadline: 12          # 实测产出很低（每次 3~6 条），不值得拖慢整体
    concurrency: 3
    rate_limit_qps: 1.5         # 实测 0.4 太保守：6 个请求光限速就要 15s
    fetch_result_pages: true    # 阶段 2：抓内容页（召回主力，比阶段 1 值钱）
    max_pages: 20
    page_timeout: 10
    page_concurrency: 8
    engines:
      brave: "https://search.brave.com/search?q={q}"
      so: "https://www.so.com/s?q={q}"
    templates:
      - 'site:pan.baidu.com/s {kw}'
      - '"{kw}" 百度网盘 提取码'

  bilibili:
    enabled: false
    kind: bilibili
    weight: 0.8
    timeout: 20
    concurrency: 2
    rate_limit_qps: 1.0
    fetch_comments: true

verify:
  enabled: true
  concurrency: 16         # 跨网盘并发；每个网盘另有自己的限速
  rate_limit_qps: 5.0     # 百度专用（对 pan.baidu.com 温柔一点）
  cache_ttl_hours: 6
  timeout: 15
  retries: 1
  # 验活预算：结果很多时只验活**最相关**的前 N 条（先按相关性排序再验活）。
  # 验活是冷搜索的瓶颈：255 次真实请求 ≈ 20 秒（夸克限速 10 qps 就占 18 秒）。
  # 而用户通常只看前几十条，所以没必要验活几百条；超出的标记为"未校验"。
  # 设为 0 表示不限制（全量验活，700+ 条要 1~2 分钟）。
  budget: 150
  # 各网盘验活的独立限速（覆盖 config/pan_errno.yaml 里的 qps）
  services:
    quark:  {qps: 10.0}
    aliyun: {qps: 10.0}
    "115":  {qps: 6.0}
    tianyi: {qps: 6.0}

scoring:
  kind_weight:
    pansou: 1.0
    tg: 0.9
    bilibili: 0.8
    forum: 0.8
    websearch: 0.6
  status_weight:
    alive: 1.0            # 提取码已验证正确
    need_pwd: 0.8         # 存活，需提取码
    wrong_pwd: 0.5        # 存活但码不对
    unchecked: 0.6
    unsupported: 0.6      # 非百度，未校验
    unknown: 0.3
    dead: 0.02
    not_found: 0.0
  multi_source_bonus: 0.12   # 多源命中加成：每多一个来源相对提升 12%（封顶 +35%）
  freshness_halflife_days: 730
  pan_priority_bonus: 0.25   # 百度优先：相对提升 25%（乘法因子，不做排序层级）
  relaxed_penalty: 0.5       # 只被"放宽查询"命中的结果降权为 50%
  relevance_power: 2.0       # 相关性幂次闸门：把"主题词命中/缺失"的差距拉大，防止被加成翻盘

# 抓取阶段的整体截止时间（秒）：超过就跳过还没返回的数据源。
# 实测 TG 本地索引 0.0s / PanSou 8~15s / Brave 15~22s —— 不等最慢的那个。
fetch_deadline: 15
