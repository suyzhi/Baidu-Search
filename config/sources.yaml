# 数据源配置：开关 / 权重 / 限速
# 新增一个数据源 = 写一个 adapters/xxx.py + 在这里加一段

# 百度优先，其余网盘兜底
pan_priority:
  - baidu
  - quark
  - aliyun
  - "115"
  - xunlei
  - tianyi
  - "123"
  - uc
  - pikpak
  - magnet

sources:
  pansou:
    enabled: true
    kind: pansou
    # 自建实例优先（scripts/start-pansou.sh 一键起 Docker）：
    #   实测「三体」自建 374 条（百度 28）vs 公共 41 条（百度 1）；
    #   热缓存 0.17s，冷启动 8~30s。公共实例作兜底。
    instances:
      - http://127.0.0.1:8888
      - https://so.252035.xyz
    weight: 1.0
    timeout: 20
    # 截止时间必须收着给：主查询与补搜查询是并行的，各自都会吃满这个上限。
    # 实测设 45s 时，一次 PanSou 卡顿会让整体搜索变成 45s(等待) + 验活 ≈ 52s。
    # 正常情况抓取只要 4.2s（热缓存 0.2s），20s 足够覆盖冷启动。
    deadline: 20
    retries: 0            # 自建实例失败就直接降级到公共实例，不必重试
    concurrency: 2
    rate_limit_qps: 5.0

  # ---- C 环：Telegram 频道（本地索引直连）----
  # 全网网盘链接的主要产地。直连 t.me，不经第三方，可并行上百频道 + 向历史翻页。
  # 首次搜索若索引为空会自动抓一轮；之后用 pansearch index crawl 持续加深。
  telegram:
    enabled: true
    kind: tg
    weight: 0.9
    auto_index: true          # 索引为空时自动抓最新一页
    max_hits: 400             # 每次检索最多取多少条消息
    crawl_concurrency: 12
    timeout: 20
    channels_file: null       # 默认 config/tg_channels.txt
    index_path: null          # 默认 .cache/tg_index.sqlite3

  # ---- 公开 API 数据源（学术 / 漫画 / 公版书）----
  # 这两个领域用 HTTP 爬页面基本爬不到：实测 Gutenberg / libgen.li /
  # manhuagui / dm5 / manhuaren 的搜索页只返回导航链接（JS 渲染），
  # 抽不到任何条目，价值校验也因此判它们"无产出"。
  # 但它们有公开 API —— 结构化、稳定、不用解析 HTML。站点清单见 config/apis.yaml。
  apisources:
    enabled: true
    kind: api
    weight: 0.7
    deadline: 25
    # apis 留空则读 config/apis.yaml
    apis: null

  # ---- 垂直资源站（音乐制作插件 / 软件类资源）----
  # 影视剧的网盘链接直接贴在 TG 里，但 VST/音源/桌面软件不是 ——
  # 实测 Serum / Omnisphere / 大气合成器 在 21 万条 TG 索引里是 0 条，
  # PanSou 的 65 个插件也几乎不覆盖。这个垂直领域的资源发布在专业资源站上，
  # 且下载入口在**详情页**里（搜索页只有标题链接），所以要两阶段跟进。
  sitesearch:
    enabled: true
    kind: forum
    weight: 0.75
    deadline: 20
    concurrency: 4          # 同时打几个站
    max_pages: 4            # 每个站最多跟进几个详情页（再多收益很小）
    page_timeout: 12
    page_concurrency: 10
    # result_re 用来从搜索结果页挑详情页；单引号里 '' 表示一个 '
    sites:
      - name: audioz
        search: "https://audioz.download/?s={q}"
        # 真帖子形如 /software/300623-download_native-instruments-kontakt-8....html
        # 别写成 /\d{4}/\d{2}/ —— 那会匹配到归档日期页（/2026/09/01/）
        result_re: 'https://audioz\.download/[a-z]+/\d+-download_[^"''<>\s]+\.html'
      - name: looptorrent
        search: "https://looptorrent.net/?s={q}"
        result_re: 'https://looptorrent\.net/[a-z0-9][a-z0-9-]{6,}/'
      - name: 4download
        search: "https://4download.net/?s={q}"
        result_re: 'https://4download\.net/[a-z0-9-]{6,}/'
      - name: vstorrent
        search: "https://vstorrent.org/?s={q}"
        result_re: 'https://vstorrent\.org/[a-z0-9-]{6,}/'
      - name: ghxi
        search: "https://www.ghxi.com/?s={q}"
        result_re: 'https://www\.ghxi\.com/[a-z0-9-]+\.html'
      - name: 423down
        search: "https://www.423down.com/?s={q}"
        result_re: 'https://www\.423down\.com/\d+\.html'
      - name: dayanzai
        search: "https://www.dayanzai.me/?s={q}"
        result_re: 'https://www\.dayanzai\.me/[a-z0-9-]+\.html'

  # ---- B 环：搜索引擎定向检索（捞聚合站搜不到的"野链接"）----
  # 两阶段：先搜到"资源讨论页"，再抓这些页面抽网盘链接。
  # 实测：绝大多数引擎不索引 pan.baidu.com/s 本身，但索引讨论页 → 必须两阶段。
  # brave 直接命中最多但会 429；so 备用。
  websearch:
    enabled: true
    kind: websearch
    weight: 0.6
    timeout: 25
    deadline: 12          # 实测产出很低（每次 3~6 条），不值得拖慢整体
    concurrency: 3
    rate_limit_qps: 1.5         # 实测 0.4 太保守：6 个请求光限速就要 15s
    fetch_result_pages: true    # 阶段 2：抓内容页（召回主力，比阶段 1 值钱）
    max_pages: 20
    page_timeout: 10
    page_concurrency: 8
    engines:
      # 实测（2026-09）逐个引擎的结果：
      #   brave    429 长期限流                       ❌ 白耗 3s
      #   so.com   200 但只有 9.8KB 反爬空壳页        ❌ 白耗 2.7s
      #   bing     200，结果页直接含 pan.baidu 链接   ✅
      #   ddg      200，结果页直接含 pan.baidu 链接   ✅
      #   另测 startpage / marginalia / searx / yandex / ecosia 均零网盘结果或 403。
      # 两个失效引擎的组合会让这个源恒定 0 条却每次都耗 3~8 秒。
      bing: "https://cn.bing.com/search?q={q}"
      ddg: "https://html.duckduckgo.com/html/?q={q}"
    templates:
      - 'site:pan.baidu.com/s {kw}'
      - '"{kw}" 百度网盘 提取码'

  bilibili:
    enabled: false
    kind: bilibili
    weight: 0.8
    timeout: 20
    concurrency: 2
    rate_limit_qps: 1.0
    fetch_comments: true

verify:
  enabled: true
  concurrency: 16         # 跨网盘并发；每个网盘另有自己的限速
  rate_limit_qps: 5.0     # 百度专用（对 pan.baidu.com 温柔一点）
  cache_ttl_hours: 6
  timeout: 15
  retries: 1
  # 验活预算：结果很多时只验活**最相关**的前 N 条（先按相关性排序再验活）。
  # 验活是冷搜索的瓶颈：255 次真实请求 ≈ 20 秒（夸克限速 10 qps 就占 18 秒）。
  # 而用户通常只看前几十条，所以没必要验活几百条；超出的标记为"未校验"。
  # 设为 0 表示不限制（全量验活，700+ 条要 1~2 分钟）。
  budget: 150
  # 各网盘验活的独立限速（覆盖 config/pan_errno.yaml 里的 qps）
  services:
    quark:  {qps: 10.0}
    aliyun: {qps: 10.0}
    "115":  {qps: 6.0}
    tianyi: {qps: 6.0}

scoring:
  kind_weight:
    pansou: 1.0
    tg: 0.9
    # API 直链（arXiv/Crossref/OpenAlex/MangaDex）是结构化来源，可信度高。
    # 漏配这一项会掉到默认 0.6 —— 实测学术查询里直链会被"侵略机器 War Machine"
    # 这种只命中了 "machine" 的网盘结果压下去。
    api: 0.95
    bilibili: 0.8
    forum: 0.8
    websearch: 0.6
  status_weight:
    alive: 1.0            # 提取码已验证正确
    need_pwd: 0.8         # 存活，需提取码
    wrong_pwd: 0.5        # 存活但码不对
    unchecked: 0.6
    unsupported: 0.6      # 非百度，未校验
    unknown: 0.3
    dead: 0.02
    not_found: 0.0
  multi_source_bonus: 0.12   # 多源命中加成：每多一个来源相对提升 12%（封顶 +35%）
  freshness_halflife_days: 730
  pan_priority_bonus: 0.25   # 百度优先：相对提升 25%（乘法因子，不做排序层级）
  relaxed_penalty: 0.5       # 只被"放宽查询"命中的结果降权为 50%
  relevance_power: 2.0       # 相关性幂次闸门：把"主题词命中/缺失"的差距拉大，防止被加成翻盘

# 抓取阶段的整体截止时间（秒）：超过就跳过还没返回的数据源。
# 实测 TG 本地索引 0.0s / PanSou 8~15s / Brave 15~22s —— 不等最慢的那个。
fetch_deadline: 15
