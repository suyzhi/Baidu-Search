# 数据源配置：开关 / 权重 / 限速
# 新增一个数据源 = 写一个 adapters/xxx.py + 在这里加一段

# 百度优先，其余网盘兜底
pan_priority:
  - baidu
  - quark
  - aliyun
  - "115"
  - xunlei
  - tianyi
  - "123"
  - uc
  - pikpak
  - magnet

sources:
  pansou:
    enabled: true
    kind: pansou
    # 自建实例优先（scripts/start-pansou.sh 一键起 Docker）：
    #   实测「三体」自建 374 条（百度 28）vs 公共 41 条（百度 1）；
    #   热缓存 0.17s，冷启动 8~30s。公共实例作兜底。
    instances:
      - http://127.0.0.1:8888
      - https://so.252035.xyz
    weight: 1.0
    timeout: 20
    # 截止时间要能覆盖"冷查询"：实测冷查询（容器刚起/关键词首次）要 19s+，
    # 设 20s 会**刚好卡在边界上超时** —— 表现就是界面上那句
    # "pansou: 实例超时"，而其实再等两三秒就有结果。热缓存只要 0.2s。
    # 28s = 冷查询 ~19s + 降级到公共实例的余量；它只影响最慢的那次，不影响热查询。
    deadline: 28
    retries: 0            # 自建实例失败就直接降级到公共实例，不必重试
    concurrency: 2
    rate_limit_qps: 5.0


  # ---- C 环：B 站内搜（视频简介 + 评论区）----
  # 网盘链接的真实产地：影视/软件的分享链接常常只贴在视频简介与评论区里
  # （"链接：pan.baidu.com/s/xxx 提取码：xxxx"），搜索引擎索引不全、PanSou 不覆盖。
  # 接口全部需要 WBI 签名 + 游客 buvid cookie，见 adapters/bilibili.py。
  bilibili:
    enabled: true
    kind: bilibili
    weight: 0.8
    # 请求账：3 个模板 × 1 页搜索 + 1 次专栏搜索 + 最多 10 个视频 ×（简介 + 评论）≈ 25 次
    # 以 4 qps 计约 6 秒；冷启动时 nav 取 key 再加 1 次。15 秒留足余量。
    deadline: 15
    concurrency: 5
    rate_limit_qps: 4.0
    search_pages: 1          # 每个模板抓几页（每页 20 条）
    max_videos: 10           # 最多跟进多少个视频的简介 + 评论区
    max_articles: 6          # 专栏只取搜索接口的摘要（正文需要浏览器渲染）
    comment_pages: 1         # 评论翻几页；热评第一页覆盖大部分资源留言
    comments: true
    articles: true
    templates:
      - "{kw}"
      # 后两条专捞"贴了网盘链接"的资源贴：只发原始关键词会漏掉这类标题
      - "{kw} 百度网盘"
      - "{kw} 资源 提取码"


  # ---- D 环：BT / 磁力站（磁力链接的直接产地）----
  # 为什么单列：BT 站的搜索页**就是**结果页（magnet 直接在行内），与 sitesearch 的
  # "搜索页→详情页"两阶段模型不同；标题要从 magnet 的 dn= 里取，否则打分判低相关。
  # 实测（关键词「三体」）：nyaa 75 条 magnet、dmhy 46 条；1337x 403 / btdig 429 不收。
  btsearch:
    enabled: true
    kind: bt
    weight: 0.6
    # nyaa 单站就要 ~9.6s（实测），4 个站并发打时 12s 预算会被砍掉整源；
    # deadline 15s + 每查询最多 4 站（nyaa / dmhy / mikan / sukebei 按垂直命中挑）。
    deadline: 15
    concurrency: 4
    rate_limit_qps: 1.5
    max_sites: 4
    page_timeout: 10
    page_concurrency: 4

  # ---- C 环：Telegram 频道（本地索引直连）----
  # 全网网盘链接的主要产地。直连 t.me，不经第三方，可并行上百频道 + 向历史翻页。
  # 首次搜索若索引为空会自动抓一轮；之后用 pansearch index crawl 持续加深。
  telegram:
    enabled: true
    kind: tg
    weight: 0.9
    auto_index: true          # 整个索引为空时才抓最新一页；关键词无命中不触发
    max_hits: 400             # 每次检索最多取多少条消息
    crawl_concurrency: 12
    timeout: 20
    channels_file: null       # 默认 config/tg_channels.txt
    index_path: null          # 默认 .cache/tg_index.sqlite3

  # ---- 公开 API 数据源（学术 / 漫画 / 公版书）----
  # 这两个领域用 HTTP 爬页面基本爬不到：实测 Gutenberg / libgen.li /
  # manhuagui / dm5 / manhuaren 的搜索页只返回导航链接（JS 渲染），
  # 抽不到任何条目，价值校验也因此判它们"无产出"。
  # 但它们有公开 API —— 结构化、稳定、不用解析 HTML。站点清单见 config/apis.yaml。
  apisources:
    enabled: true
    kind: api
    weight: 0.7
    deadline: 25
    # apis 留空则读 config/apis.yaml
    apis: null

  # ---- 垂直资源站（音乐制作插件 / 软件类资源）----
  # 影视剧的网盘链接直接贴在 TG 里，但 VST/音源/桌面软件不是 ——
  # 实测 Serum / Omnisphere / 大气合成器 在 21 万条 TG 索引里是 0 条，
  # PanSou 的 65 个插件也几乎不覆盖。这个垂直领域的资源发布在专业资源站上，
  # 且下载入口在**详情页**里（搜索页只有标题链接），所以要两阶段跟进。
  sitesearch:
    enabled: true
    kind: forum
    weight: 0.75
    # 实测这一源单次要 13~29 秒，却只回 0~17 条（Serum 合成器 28 秒回 1 条），
    # 而同期的 telegram 0.4 秒回 131 条。它长期是整条链路的关键路径。
    # 砍到 12 秒：慢站拿不到就算了，不再让它一个人决定整次搜索要等多久。
    # 目录 54 个站，但**每次查询只打 10 个**（垂直命中优先、再按探测 yield 排序）。
    # 上轮试过 16 个：实测频繁 12s 预算跑不完 → 整源超时、返回 0 条，
    # 反而不如少打几个把结果拿回来。
    deadline: 15
    concurrency: 8          # 同时打几个站
    max_sites: 10           # 每个查询最多打几个站
    max_pages: 4            # 每个站最多跟进几个详情页（再多收益很小）
    page_timeout: 12
    page_concurrency: 10
    # 使用 config/sites.yaml 的分类路由；固定列表会绕过路由，搜电影也打软件站。
    # 临时定向排查时才显式指定列表，日常保持 null。
    sites: null

  # ---- B 环：搜索引擎定向检索（捞聚合站搜不到的"野链接"）----
  # 两阶段：先搜到"资源讨论页"，再抓这些页面抽网盘链接。
  # 实测：绝大多数引擎不索引 pan.baidu.com/s 本身，但索引讨论页 → 必须两阶段。
  # brave 直接命中最多但会 429；so 备用。
  websearch:
    # ✅ 重新开启（2026-09-21 复测）：旧结论"零召回"是**模板**的问题，不是引擎挂了。
    #   旧模板 'site:pan.baidu.com/s {kw}' 确实只回查询回显（引擎不索引分享页本身），
    #   换成"资源意图"模板后同样三个引擎都能出东西：
    #     bing  '{kw} 百度网盘'          97KB，候选页含 tieba/zhidao，结果页直接带 2 条 pan 链
    #     ddg   '{kw} 百度网盘'          30KB，结果页直接带 3 条 pan 链
    #     sogou '{kw} 网盘 提取码 分享'  466KB，结果页直接带 5 条 pan 链 + 公众号文章
    #   实测逐个引擎（2026-09-21）：
    #     brave 429 / ecosia 403 / so.com 只有反爬壳 / yandex·mojeek·searx 零结果 ❌
    enabled: true
    kind: websearch
    weight: 0.6
    timeout: 25
    # 8 个引擎 × 3 个模板 = 24 次搜索请求 + 阶段 2 抓页 —— 实测 12s 根本跑不完，
    # 整源被砍成"超时/降级"（界面上那一串告警就是这么来的）。改成：
    #   模板 3 → 2（去掉产出最差的 'site:tieba...'，它已被前两条覆盖）
    #   deadline 12 → 15，并发 5 → 8
    # 让"每次都真的跑到结果"，而不是每次都刚好被截断。
    deadline: 15
    concurrency: 8
    rate_limit_qps: 3.0
    fetch_result_pages: true  # 阶段 2：抓内容页（召回主力，比阶段 1 值钱）
    max_pages: 12
    page_timeout: 8
    page_concurrency: 8
    engines:
      # 复测（2026-09-21，模板 "{kw} 百度网盘 提取码"）：
      #   baidu  983KB，结果页直接带 3 条 pan 链 + 59 个候选内容页 ✅
      #   bing    94KB，15 个候选内容页                          ✅
      #   ddg     31KB，结果页直接带 2 条 pan 链                 ✅
      #   sogou  466KB/5KB 波动（限流时几乎空页），保留但排最后  ⚠️
      #   so.com 352KB，19 个候选内容页（无直接链）              ⚠️ 备选
      #   brave 429 / ecosia 403 / yandex·mojeek·searx·marginalia·startpage 零结果 ❌
      bing: "https://cn.bing.com/search?q={q}"
      baidu: "https://www.baidu.com/s?wd={q}"
      ddg: "https://html.duckduckgo.com/html/?q={q}"
      sogou: "https://www.sogou.com/web?query={q}"
      so360: "https://www.so.com/s?q={q}"
      # 自建 SearXNG（scripts/start-searxng.sh）：**一个后端换回十几个引擎**，
      # 包括直连时 429/403 的 google/brave/qwant/mojeek。
      # 实测（2026-09-21，"三体 百度网盘"）：20 条结果，其中 6 条带 pan 链，
      # 还带出 rrdynb/zaodianying/ewang100 这类"资源讨论页"，正是阶段 2 要抓的。
      # 复测新增（2026-09-21，模板「{kw} 百度网盘 提取码」）：
      #   naver   350KB，结果页直接带 3 条 pan 链 + 24 个候选内容页（含 bilibili/豆瓣/论坛）
      #   toutiao 1.67MB，结果页直接带 1 条 pan 链 + 3~16 个候选页
      #   （sogou 本次退化为反爬壳、ddg 返回 202 挑战页 —— 保留但不指望，见 deadline 兜底）
      naver: "https://search.naver.com/search.naver?query={q}"
      toutiao: "https://so.toutiao.com/search?keyword={q}"
      searxng: "http://127.0.0.1:8889/search?q={q}&format=json"
    templates:
      # 引擎不索引 pan.baidu.com/s 本身，但**索引"资源讨论页"**；
      # 两条模板覆盖"结果页直接带链接"和"找到讨论页再跟进"。
      # 去掉 'site:tieba.baidu.com {kw}'：它是 8 个引擎各发一次的固定成本，
      # 而贴吧帖子本来就会被前两条模板带出来（bing/baidu 对中文资源词的召回里常有 tieba）。
      - '{kw} 百度网盘'
      - '{kw} 网盘 提取码 分享'

verify:
  enabled: true
  concurrency: 16         # 跨网盘并发；每个网盘另有自己的限速
  rate_limit_qps: 5.0     # 百度专用（对 pan.baidu.com 温柔一点）
  cache_ttl_hours: 6
  timeout: 15
  retries: 1
  # 验活预算：先恢复全部缓存，只对最相关的 N 条未缓存资源发起联网校验。
  # 验活是冷搜索的瓶颈：255 次真实请求 ≈ 20 秒（夸克限速 10 qps 就占 18 秒）。
  # 而用户通常只看前几十条，所以没必要验活几百条；超出的标记为"未校验"。
  # 设为 0 表示不限制（全量验活，700+ 条要 1~2 分钟）。
  budget: 150
  deadline: 8               # 有限预算模式最多等待 8 秒；未完成的保留为未校验
  # 各网盘验活的独立限速（覆盖 config/pan_errno.yaml 里的 qps）
  services:
    quark:  {qps: 10.0}
    aliyun: {qps: 10.0}
    "115":  {qps: 6.0}
    tianyi: {qps: 6.0}

scoring:
  kind_weight:
    pansou: 1.0
    tg: 0.9
    # API 直链（arXiv/Crossref/OpenAlex/MangaDex）是结构化来源，可信度高。
    # 漏配这一项会掉到默认 0.6 —— 实测学术查询里直链会被"侵略机器 War Machine"
    # 这种只命中了 "machine" 的网盘结果压下去。
    api: 0.95
    bilibili: 0.8
    forum: 0.8
    # BT / 磁力站：磁力不需要提取码也不用验活，但稀有度/可信度低于网盘分享，
    # 且大量是"字幕组压片"，所以权重压在论坛之下、搜索引擎之上。
    bt: 0.55
    websearch: 0.6
  status_weight:
    alive: 1.0            # 提取码已验证正确
    need_pwd: 0.8         # 存活，需提取码
    wrong_pwd: 0.5        # 存活但码不对
    unchecked: 0.6
    unsupported: 0.6      # 非百度，未校验
    unknown: 0.3
    dead: 0.02
    not_found: 0.0
  multi_source_bonus: 0.12   # 多源命中加成：每多一个来源相对提升 12%（封顶 +35%）
  # RRF（Reciprocal Rank Fusion）：Σ 1/(60+rank)，多路召回都排前面的资源更可信。
  # 1.0 = 系数（单来源第 1 名约 +1.7%；三个来源都进前排约 +5%）。
  rrf_bonus: 1.0
  freshness_halflife_days: 730
  pan_priority_bonus: 0.25   # 百度优先：相对提升 25%（乘法因子，不做排序层级）
  relaxed_penalty: 0.5       # 只被补搜命中且未完整匹配的结果降权；完整匹配不扣分
  relevance_power: 2.0       # 相关性幂次闸门：把"主题词命中/缺失"的差距拉大，防止被加成翻盘

# 成人内容源标记（默认**启用**，用 pansearch search --sfw 可一键过滤掉）。
# 为什么按"来源"而不是按关键词过滤：javdb 这类源返回的**就是**成人内容，
# 靠标题关键词猜既会漏（不同语言/缩写）也会误伤（"写真集""深夜剧"这类正常资源）。
# 标记写成"来源标签的前缀/子串"，与结果里的 sources 字段对应。
adult_sources:
  - "plugin:javdb"     # PanSou 的 JavDB 插件（成人影片数据库）
  - "bt:sukebei"       # sukebei.nyaa.si（nyaa 的成人分区）

# 抓取阶段的整体截止时间（秒）：超过就跳过还没返回的数据源。
# 实测 TG 本地索引 0.0s / PanSou 8~15s / Brave 15~22s —— 不等最慢的那个。
fetch_deadline: 15

# 查询级缓存：同一关键词 + 同一组参数在 N 秒内复用整份结果。
# 主要买的是**一致性**（同一搜索不会因网络抖动给出不同答案）和一次全网抓取；
# 只缓存"有结果"或"没有源降级"的搜索，源故障导致的空结果仍可重试。0 = 关闭。
search_cache_ttl_seconds: 300
