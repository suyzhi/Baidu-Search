name: Search regression
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[web,dev,quality]'
      - run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/quality_eval.py --gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
